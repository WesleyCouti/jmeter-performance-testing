# Target environment
base_url=jsonplaceholder.typicode.com
protocol=https

# HTTP timeouts
connect_timeout_ms=5000
response_timeout_ms=5000

# Per-request SLA
response_time_limit_ms=2000

# Smoke defaults
threads=1
ramp_up=1
loops=1

# Load defaults
users=10
think_time_ms=250

# Stress defaults
duration_seconds=30

# Test data
csv_file=data/post-ids.csv

# JMeter HTML report configuration
jmeter.reportgenerator.overall_granularity=1000
